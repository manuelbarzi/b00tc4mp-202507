<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>App</h1>

    <div id="registerView">
        <h2>Register</h2>

        <form id="registerForm">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" />

            <label for="dateOfBirth">Date of birth</label>
            <input type="date" id="dateOfBirth" />

            <label for="email">E-mail</label>
            <input type="email" id="email" />

            <label for="password">Password</label>
            <input type="password" id="password" />

            <button type="submit">Register</button>
        </form>

        <a id="loginLink" href="http://">Login</a>
    </div>

    <div id="loginView">
        <h2>Login</h2>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <input type="email" id="email" />

            <label for="password">Password</label>
            <input type="password" id="password" />

            <button type="submit">Login</button>
        </form>

        <a id="registerLink" href="http://">Register</a>
    </div>

    <div id="homeView">
        <h2>Home</h2>

        <p>Hello, <span id="fullNameSpan">[fullName]</span>!</p>

        <button id="logoutButton">Logout</button>

        <div>
            <h3>Change e-mail</h3>

            <form id="changeEmailForm">
                <label for="email">E-mail</label>
                <input type="email" id="email">

                <label for="newEmail">New e-mail</label>
                <input type="email" id="newEmail">

                <label for="newEmailRepeat">New e-mail repeat</label>
                <input type="email" id="newEmailRepeat">

                <button type="submit">Change e-mail</button>
            </form>
        </div>

        <div>
            <h3>Change password</h3>

            <form id="changePasswordForm">
                <label for="password">Password</label>
                <input type="password" id="password">

                <label for="newPassword">New password</label>
                <input type="password" id="newPassword">

                <label for="newPasswordRepeat">New password repeat</label>
                <input type="password" id="newPasswordRepeat">

                <button type="submit">Change password</button>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
</body>

</html>
